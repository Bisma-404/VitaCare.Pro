<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <style>
        /* Teal & black theme variables for this template */
        :root { --accent: #008b8b; --accent-light: #30e3ca; --bg-main: #000; --bg-card: #0d0d0d; --text-main: #fff; --text-muted: #a7e0df; }
    </style>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main, #181B20);
            color: var(--text-main, #FFF);
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: var(--bg-card, #22262E);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 36px 0 rgba(8, 217, 214, 0.1);
        }

        h2 {
            color: var(--accent, #08D9D6);
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted, #B8E2E7);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            background: var(--nav-bg, #171A1F);
            border: 1px solid var(--disabled, #444A55);
            color: var(--text-main, #FFF);
            border-radius: 8px;
            box-sizing: border-box;
        }

        input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button {
            background: var(--accent, #08D9D6);
            color: var(--bg-main, #181B20);
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted, #B8E2E7);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <!-- Admin header removed for cleaner admin panel (top navbar removed) -->
    <header class="admin-header">
        <div>
            <h1>Edit User</h1>
            <p class="muted">Modify user details and permissions</p>
        </div>
    </header>
    <style>
        .admin-header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--bg-card,#0d0d0d);border-radius:10px;margin-bottom:18px}
        .admin-header h1{margin:0;color:var(--accent,#008b8b);font-size:1.25rem}
        .admin-header .muted{color:var(--text-muted,#a7e0df);font-size:0.9rem}
    </style>
    <div class="container">
        <div class="card">
            <h2>✏️ Edit User</h2>
            <form id="editUserForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" value="{{ user.username }}" disabled>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" value="{{ user.email }}" disabled>
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" value="{{ user.name or user.username }}" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select name="role">
                        <option value="doctor" {% if user.role=='DOCTOR' %}selected{% endif %}>Doctor</option>
                        <option value="lab_tech" {% if user.role=='LAB_TECH' %}selected{% endif %}>Lab Technician</option>
                        <option value="patient" {% if user.role=='PATIENT' %}selected{% endif %}>Patient</option>
                        <option value="admin" {% if user.role=='ADMIN' %}selected{% endif %}>Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone_number" value="{{ user.phone or '' }}">
                </div>
                <button type="submit">Update User</button>
            </form>
            <a href="{{ url_for('admin.manage_users') }}" class="back-link">← Back to Users</a>
        </div>
    </div>

    <script>
        document.getElementById('editUserForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch("{{ url_for('admin.edit_user', user_id=user.id) }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    alert('User updated successfully!');
                    window.location.href = "{{ url_for('admin.manage_users') }}";
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('An error occurred');
            }
        });
    </script>
</body>

</html>
