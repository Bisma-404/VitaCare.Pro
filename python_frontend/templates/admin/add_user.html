<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <style>
        :root { --accent: #08D9D6; --accent-light: #2CE7DD; --bg-main: #181B20; --bg-card: #22262E; --nav-bg: #171A1F; --text-main: #FFFFFF; --text-muted: #B8E2E7; }
        html.light { --accent: #047a7a; --accent-light: #059494; --bg-main: #e8f4f5; --bg-card: #f5fafa; --nav-bg: #d0e9ea; --text-main: #0a1a1a; --text-muted: #2a3a3a; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main, #181B20);
            color: var(--text-main, #FFF);
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: var(--bg-card, #22262E);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 36px 0 rgba(8, 217, 214, 0.1);
        }

        h2 {
            color: var(--accent, #08D9D6);
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted, #B8E2E7);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            background: var(--nav-bg, #171A1F);
            border: 1px solid var(--disabled, #444A55);
            color: var(--text-main, #FFF);
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            background: var(--accent, #08D9D6);
            color: var(--bg-main, #181B20);
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted, #B8E2E7);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <!-- Admin header removed for cleaner admin panel (top navbar removed) -->
    <header class="admin-header">
        <div>
            <h1>Add User</h1>
            <p class="muted">Create a new user account</p>
        </div>
    </header>
    <style>
        .admin-header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--bg-card,#0d0d0d);border-radius:10px;margin-bottom:18px}
        .admin-header h1{margin:0;color:var(--accent,#008b8b);font-size:1.25rem}
        .admin-header .muted{color:var(--text-muted,#a7e0df);font-size:0.9rem}
    </style>
    <div class="container">
        <div class="card">
            <h2>➕ Add New Staff</h2>
            <form id="addUserForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select name="role" required>
                        <option value="doctor">Doctor</option>
                        <option value="lab_tech">Lab Technician</option>
                        <option value="patient">Patient</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phone Number (Optional)</label>
                    <input type="tel" name="phone_number">
                </div>
                <button type="submit">Add User</button>
            </form>
            <a href="{{ url_for('admin.dashboard') }}" class="back-link">← Back to Dashboard</a>
        </div>
    </div>

    <script>
        document.getElementById('addUserForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch("{{ url_for('admin.add_user') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    alert('User added successfully!');
                    window.location.href = "{{ url_for('admin.manage_users') }}";
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('An error occurred');
            }
        });
    </script>
</body>

</html>
