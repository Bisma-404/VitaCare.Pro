<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - VitaCare Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #008b8b; --accent-light: #30e3ca; --bg-main:#000; --bg-card:#0d0d0d; --text-main:#fff; --text-muted:#a7e0df; }
    </style>
    <style>
        html,body { transition: background 0.45s, color 0.3s; }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-main, #181B20);
            min-height: 100vh;
            margin: 0;
            color: var(--text-main, #FFF);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        :root {
            --bg-main: #181B20;
            --bg-card: #22262E;
            --nav-bg: #171A1F;
            --form-card-bg: #232730;
            --accent: #08D9D6;
            --accent-light: #30E3CA;
            --accent-contrast: #22262E;
            --input-bg: #191e22;
            --input-border: #08d9d670;
            --disabled: #444A55;
            --text-main: #FFFFFF;
            --text-muted: #B8E2E7;
            --shadow: 0 6px 36px 0 #08d9d622;
        }
        html.light {
            --bg-main: #F4FEFF;
            --bg-card: #E4FBF8;
            --nav-bg: #DDF3F4;
            --form-card-bg: #FFF;
            --accent: #11C8C9;
            --accent-light: #18c0ce;
            --accent-contrast: #e4fbf8;
            --input-bg: #fff;
            --input-border: #11C8C977;
            --disabled: #bde1df;
            --text-main: #1B263B;
            --text-muted: #455664;
            --shadow: 0 8px 28px 0 #11c8c933;
        }
        .register-container {
            width: 100%;
            max-width: 500px;
        }
        .nav-bar {
            width: 100vw; background: var(--nav-bg);
            color: var(--accent); font-weight: 800;
            letter-spacing: 0.5px; box-shadow: var(--shadow);
            padding: 18px 0; text-align: center; font-size: 1.32em;
            border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
            position: fixed;
            top: 0;
            z-index: 1000;
        }
        .theme-switcher {
            position: absolute; top: 8px; right: 18px;
            cursor: pointer; font-size: 1.75em; color: var(--accent);
            background: none; border: none; outline: none; transition: color .25s;
        }
        .register-card {
            background: var(--bg-card);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 40px;
            margin-top: 80px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .register-header h1 {
            color: var(--accent);
            font-weight: 800;
            font-size: 2em;
            margin-bottom: 8px;
        }
        .form-label {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.05em;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            transition: border-color .22s, background .35s;
            background: var(--input-bg);
            color: var(--text-main);
            margin-bottom: 20px;
        }
        .form-control:focus {
            border-color: var(--accent);
            outline: none;
        }
        .btn-register {
            background: linear-gradient(135deg, var(--accent) 0%, #2ce7dd 100%);
            border: none;
            padding: 14px;
            font-weight: 700;
            width: 100%;
            border-radius: 25px;
            color: var(--accent-contrast);
            font-size: 1.08em;
            cursor: pointer;
            box-shadow: 0 7px 24px #30e3ca33;
            transition: opacity 0.19s;
        }
        .btn-register:hover {
            opacity: 0.89;
        }
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .alert-danger {
            background: #ff444433;
            border-left: 4px solid #ff4444;
            color: #ff6666;
        }
        .alert-success {
            background: #44ff4433;
            border-left: 4px solid #44ff44;
            color: #66ff66;
        }
        .text-center {
            text-align: center;
        }
        .text-center a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .text-center a:hover {
            text-decoration: underline;
        }
        .text-center p {
            color: var(--text-muted);
            margin-top: 20px;
        }
    </style>
    <script>
    function setTheme(mode) {
      document.documentElement.className = mode;
      localStorage.setItem('theme', mode);
      const switcher = document.getElementById('theme-switcher');
      if (switcher) switcher.textContent = mode === 'dark' ? '☀️' : '🌙';
    }
    function toggleTheme() {
      const current = document.documentElement.classList.contains('light') ? 'light':'dark';
      setTheme(current === 'dark' ? 'light' : 'dark');
    }
    document.addEventListener('DOMContentLoaded',function(){
      let theme = localStorage.getItem('theme');
      if(!theme){ theme = 'dark'; localStorage.setItem('theme','dark'); }
      setTheme(theme);
    });
    </script>
</head>
<body>
    <div class="nav-bar">
        🏥 VitaCare Pro
        <button id="theme-switcher" class="theme-switcher" onclick="toggleTheme()" title="Toggle dark/light mode">🌙</button>
    </div>
    
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>📝 Patient Registration</h1>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=True) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST">
                <label class="form-label">Full Name *</label>
                <input type="text" name="name" class="form-control" required>
                
                <label class="form-label">Username *</label>
                <input type="text" name="username" class="form-control" required>
                
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control">
                
                <label class="form-label">Phone</label>
                <input type="tel" name="phone" class="form-control">
                
                <label class="form-label">Password *</label>
                <input type="password" name="password" class="form-control" required>
                
                <label class="form-label">Confirm Password *</label>
                <input type="password" name="confirm_password" class="form-control" required>
                
                <button type="submit" class="btn-register">Register</button>
            </form>
            
            <div class="text-center">
                <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
